name: Release

on:
  push:
    branches: [main]
    # A changeset added (opens the "Version Packages" PR), or that PR merged
    # (it bumps package.json, and publishes)
    paths:
      - .changeset/**
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a newer push must not interrupt a release in progress

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository_owner == 'jpowersdev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release branch, tags and GitHub releases
      pull-requests: write # the "Version Packages" PR
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # So the token below, not the default one, pushes the release branch:
          # pushes with the default token don't trigger CI on it.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # With changesets pending: open or update the "Version Packages" PR.
      # With none and a version not on npm: `changeset publish` (pnpm publish,
      # whose prepack builds), then tag and create the GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changesets/action v2 publishes only with a publish script.
          publish-script: pnpm changeset publish
          # A token of yours, so CI runs on the release branch; the default
          # token works too, but its PR gets no checks.
          github-token: ${{ secrets.CHANGESET_GITHUB_TOKEN || github.token }}
