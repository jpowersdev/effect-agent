name: CI

on:
  push:
    branches: [main]
    paths-ignore: &prose
      # The docs site and prose; docs.yml builds the site
      - site/**
      - assets/**
      - "**/*.md"
      - .github/workflows/docs.yml
  pull_request:
    paths-ignore: *prose

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  node:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pack

  bun:
    name: Session hosts on Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          bun-version: 1.4.2
      # vitest runs on Node; every session host these tests start runs on Bun.
      - run: pnpm test test/host.test.ts test/host-durability.test.ts test/host-hooks.test.ts test/conformance.test.ts
        env:
          EFFECT_AGENT_TEST_HOST: bun
